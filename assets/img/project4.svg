      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bg4)" rx="16"/>
  <!-- Weather UI Card -->
