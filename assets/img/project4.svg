  <path d="M190,165 C170,165 155,150 155,130 C155,112 168,98 185,96 C193,80 210,70 230,70 C255,70 275,88 277,112 C290,115 300,126 300,140 C300,154 288,165 275,165 Z" fill="#e2e8f0" />
