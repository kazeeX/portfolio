<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="396" height="396" rx="30" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-dasharray="10 8" />

  <!-- Avatar Silhouette -->
  <g filter="url(#cardShadow)">
    <!-- Head -->
    <circle cx="200" cy="155" r="62" fill="url(#avatarGrad)" />
    <!-- Shoulders / Torso -->
    <path d="M105,310 C105,235 145,215 200,215 C255,215 295,235 295,310 Z" fill="url(#avatarGrad)" />
  </g>

  <!-- Photo Placeholder Badge Icon -->
  <g transform="translate(255, 255)">
    <circle cx="28" cy="28" r="28" fill="#4f46e5" />
    <path d="M19 22h3l2-3h8l2 3h3c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H19c-1.1 0-2-.9-2-2V24c0-1.1.9-2 2-2zm9 13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0-2c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z" fill="#ffffff" transform="translate(1, 1)"/>
  </g>

  <!-- Label Text -->
  <text x="200" y="348" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="0.5">
    Area Foto Profil
  </text>
  <text x="200" y="368" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle">
    (Dapat diganti dengan foto nanti)
  </text>
</svg>
