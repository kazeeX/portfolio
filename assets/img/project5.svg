<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bg5)" rx="16"/>
  <!-- Fitness UI -->
  <rect x="60" y="40" width="480" height="280" rx="10" fill="#ffffff" />
  <!-- Rings Progress -->
  <circle cx="160" cy="180" r="70" fill="none" stroke="#f1f5f9" stroke-width="16" />
  <circle cx="160" cy="180" r="70" fill="none" stroke="#ea580c" stroke-width="16" stroke-dasharray="380" stroke-dashoffset="100" stroke-linecap="round" />
  <circle cx="160" cy="180" r="48" fill="none" stroke="#f1f5f9" stroke-width="12" />
  <circle cx="160" cy="180" r="48" fill="none" stroke="#f59e0b" stroke-width="12" stroke-dasharray="270" stroke-dashoffset="50" stroke-linecap="round" />
  <text x="160" y="175" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">82%</text>
  <text x="160" y="195" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">DAILY GOAL</text>

  <!-- Right Details -->
  <rect x="270" y="70" width="235" height="65" rx="8" fill="#fff7ed" stroke="#fed7aa" />
  <text x="290" y="95" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ea580c">CALORIES BURNED</text>
  <text x="290" y="122" font-family="sans-serif" font-size="22" font-weight="bold" fill="#9a3412">1,840 kcal</text>

  <rect x="270" y="150" width="235" height="65" rx="8" fill="#fff7ed" stroke="#fed7aa" />
  <text x="290" y="175" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ea580c">WORKOUT TIME</text>
  <text x="290" y="202" font-family="sans-serif" font-size="22" font-weight="bold" fill="#9a3412">58 mins</text>

  <rect x="270" y="230" width="235" height="65" rx="8" fill="#fff7ed" stroke="#fed7aa" />
  <text x="290" y="255" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ea580c">STEPS TAKEN</text>
  <text x="290" y="282" font-family="sans-serif" font-size="22" font-weight="bold" fill="#9a3412">10,420</text>
</svg>

